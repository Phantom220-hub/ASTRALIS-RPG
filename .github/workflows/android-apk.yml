name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Export ASTRALIS debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android platform tools
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses

      - name: Download Godot 4.7.2 editor
        run: |
          curl -L --fail --retry 3 -o godot.zip "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          unzip -q godot.zip -d godot-bin
          chmod +x godot-bin/Godot_v4.7.2-stable_linux.x86_64
          echo "$PWD/godot-bin" >> "$GITHUB_PATH"

      - name: Download Android debug export template
        run: |
          mkdir -p .godot build
          curl -L --fail --retry 3 -o .godot/android_debug.apk "https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_android_debug.perfetto.apk"

      - name: Create temporary debug signing key
        run: |
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

      - name: Import project and validate scripts
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path . --import
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --quit

      - name: Export debug APK
        run: |
          Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug "Android" build/ASTRALIS-debug.apk
          test -s build/ASTRALIS-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ASTRALIS-Android-APK
          path: build/ASTRALIS-debug.apk
          if-no-files-found: error
          retention-days: 14
